[build-system]
requires = ["setuptools==83.0.0", "wheel==0.46.2"]
build-backend = "setuptools.build_meta"

[project]
name = "kyra-shelf-guard"
version = "0.1.0"
description = "SKU-independent suspicious shelf-removal detection from replayable RGB-D data"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-only" }
authors = [{ name = "Kyra project team" }]
dependencies = [
  "numpy==2.4.6",
  "opencv-python-headless==5.0.0.93",
  "pydantic==2.13.5",
]

[project.optional-dependencies]
geometry = ["open3d==0.19.0"]
tracking = [
  "torch==2.14.0",
  "ultralytics==8.4.138",
]
midas = ["torch==2.14.0", "timm==1.0.19"]
simulation = ["blenderproc==2.8.0"]
dev = [
  "pytest==9.0.3",
  "pytest-cov==7.0.0",
  "ruff==0.13.1",
]

[project.scripts]
kyra = "kyra.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".doc-build", "graphify-out"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
